services:
  # ─────────────────────────────────────────
  #  Database
  # ─────────────────────────────────────────
  mongo_db:
    container_name: mongo_db
    image: mongo:4.4
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    # ⚠️ Port 27017 NOT exposed to host — accessible only within backend_net
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ─────────────────────────────────────────
  #  AI Engine
  # ─────────────────────────────────────────
  ai_engine:
    container_name: ai_engine
    image: chris123/ai_engine
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    env_file:
      - ./ai_engine/.env
    restart: on-failure
    volumes:
      - ./ai_engine/logs:/app/logs
      - ./ai_engine/candidate_cv:/app/candidate_cv
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/healthz')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ─────────────────────────────────────────
  #  API Server
  # ─────────────────────────────────────────
  api_server_service:
    container_name: talent_matcher_api_server
    image: chris123/talent_matcher_api_server
    build:
      context: ./api_server
      dockerfile: Dockerfile
    env_file:
      - ./api_server/.env.local
    restart: on-failure
    volumes:
      - ./api_server/logs:/app/logs
      - ./api_server/avatars:/app/avatars
    depends_on:
      mongo_db:
        condition: service_healthy
      ai_engine:
        condition: service_healthy
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ─────────────────────────────────────────
  #  Web Client
  # ─────────────────────────────────────────
  web_client_service:
    container_name: talent_matcher_web_client
    image: chris123/talent_matcher_web_client
    build:
      context: ./web_client
      dockerfile: Dockerfile
    restart: on-failure
    networks:
      - frontend_net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ─────────────────────────────────────────
  #  Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx_service:
    container_name: talent_matcher_nginx
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/develop.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/log:/var/log/nginx/
    depends_on:
      api_server_service:
        condition: service_healthy
      web_client_service:
        condition: service_healthy
    restart: on-failure
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

# ─────────────────────────────────────────
#  Networks — isolate services by role
# ─────────────────────────────────────────
networks:
  frontend_net:
    driver: bridge
    name: smarthire_frontend
  backend_net:
    driver: bridge
    name: smarthire_backend

# ─────────────────────────────────────────
#  Volumes
# ─────────────────────────────────────────
volumes:
  mongo_data:
    name: smarthire_mongo_data

upstream web_client {
    server web_client_service:3000;
}

upstream api_server {
    server api_server_service:5000;
}

server {
    listen 80;
    client_max_body_size 32M;

    server_name jobfit.vectornguyen.com;
    location ^~ /.well-known {
        root /etc/nginx/ssl/bot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jobfit.vectornguyen.com;
    client_max_body_size 32M;

    location / {
        proxy_pass http://web_client;

        # Allow the use of websockets
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'Upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api_server/ {
        proxy_pass http://api_server/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wait for a response to be received from the upstream server
        proxy_read_timeout 1200s;
    }

    # Log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
}
